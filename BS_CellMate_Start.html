<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Balance Sheet — Start</title>
<style>
  body {
    font-family: Arial, sans-serif;
    font-size: 10pt;
    background: #f9f7f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 2rem;
    box-sizing: border-box;
  }
  .card {
    position: relative;
    background: #ffffff;
    border: 1px solid #e0dbd4;
    border-radius: 12px;
    padding: 2.5rem 2.5rem;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
  }
  .title {
    font-size: 11pt;
    font-weight: bold;
    color: #2c2c2c;
    margin: 0 0 1.4rem;
  }
  select {
    width: 100%;
    padding: 6px 8px;
    font-size: 10pt;
    font-family: Arial, sans-serif;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    color: #2c2c2c;
    box-sizing: border-box;
    margin-bottom: 1.2rem;
  }
  .begin-btn {
    background: #2c2c2c;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px 20px;
    font-size: 10pt;
    font-family: Arial, sans-serif;
    cursor: pointer;
  }
  .begin-btn:disabled { background: #ccc; cursor: not-allowed; }
  .begin-btn:not(:disabled):hover { background: #444; }
  .status-msg {
    font-size: 9pt;
    color: #999;
    margin-top: 1rem;
  }
  .status-msg.error { color: #cc0000; }
</style>
</head>
<body>
  <div class="card">
    <p class="title">Balance Sheet</p>
    <select id="student-select" disabled>
      <option value="">Loading names…</option>
    </select>
    <br />
    <button class="begin-btn" id="begin-btn" onclick="begin()" disabled>Begin</button>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <script>
    // Same shared Apps Script backend the quiz itself uses.
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyvIFZMccFKAn8urP7XQWY1jCJKDBjW2cQcg51RJVM7g1qy2RCDmnPrOm_nr0_tyfo/exec';

    // Where the quiz page lives — update this to match wherever you host
    // Accounting_Equation_CellMate.html (e.g. your GitHub Pages URL).
    var QUIZ_URL = 'https://excelonion.github.io/Assignments/Balance_Sheet_CellMate.html';

    function callServer(payload) {
      return fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function(res) { return res.json(); });
    }

    function init() {
      callServer({ action: 'ae_roster' }).then(function(res) {
        var select = document.getElementById('student-select');
        var statusMsg = document.getElementById('status-msg');
        if (res.error || !res.names || res.names.length === 0) {
          select.innerHTML = '<option value="">No names available</option>';
          statusMsg.textContent = 'Could not load the roster. Please tell your instructor.';
          statusMsg.classList.add('error');
          return;
        }
        select.innerHTML = '<option value="">Select your name…</option>' +
          res.names.map(function(n) { return '<option value="' + encodeURIComponent(n) + '">' + n + '</option>'; }).join('');
        select.disabled = false;
        select.onchange = function() {
          document.getElementById('begin-btn').disabled = !select.value;
        };
      }).catch(function() {
        document.getElementById('status-msg').textContent = 'Could not load the roster. Please refresh.';
        document.getElementById('status-msg').classList.add('error');
      });
    }

    function begin() {
      var select = document.getElementById('student-select');
      if (!select.value) return;
      window.location.href = QUIZ_URL + '?student=' + select.value;
    }

    init();
  </script>
</body>
</html>
